name: Extra CI

# Opt-in checks that are too slow or heavy for every push (not part of ci.yml, so not a release gate either).
# Run from the Actions tab (workflow_dispatch) before a release or after touching fmt/; the weekly schedule
# catches upstream changes.
#   differential     compares the Kotlin formatter port with the real jsonnetfmt on fresh corpora, every option variant
#                    (needs Go and network clones, a few minutes)
#   plugin-verifier  binary Plugin Verifier against the IDE builds `pluginVerification { ides { recommended() } }` resolves
#                    (several multi-GB downloads)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The tag comes from PortedFrom.kt, so the binary always is the release the port claims to match.
      - name: Install the pinned jsonnetfmt
        run: |
          version=$(sed -n 's/.*GO_JSONNET_VERSION = "\(.*\)"/\1/p' src/main/kotlin/io/github/denis_zakharov/jsonnettanka/fmt/PortedFrom.kt)
          go install "github.com/google/go-jsonnet/cmd/jsonnetfmt@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Checks that need no corpus
        run: |
          scripts/jsonnetfmt-conformance.py version
          scripts/jsonnetfmt-conformance.py goldens

      - name: Fetch corpora
        run: scripts/jsonnetfmt-conformance.py fetch --dest "$RUNNER_TEMP/corpus"

      - name: Differential run, all variants
        run: scripts/jsonnetfmt-conformance.py differential --corpus "$RUNNER_TEMP/corpus" --variants all

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  plugin-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The hosted runner has ~14 GB free; the IDE downloads plus their extraction need more than that.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin against supported IDE builds
        run: ./gradlew verifyPlugin --console=plain
