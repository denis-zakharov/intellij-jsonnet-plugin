name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run exactly these checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle (dependencies, the downloaded IDE platform); read-only on branches other than main.
      - uses: gradle/actions/setup-gradle@v4

      # `test` includes StdLibRegistrySanityTest and the platform integration tests (headless, no display needed).
      - name: Build, test and check plugin structure
        run: ./gradlew buildPlugin test verifyPluginStructure verifyPluginProjectConfiguration --console=plain

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  # Binary Plugin Verifier against the IDE builds `pluginVerification { ides { recommended() } }` resolves
  # (several multi-GB downloads), so it's a separate job that doesn't hold up the tests.
  plugin-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The hosted runner has ~14 GB free; the IDE downloads plus their extraction need more than that.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin against supported IDE builds
        run: ./gradlew verifyPlugin --console=plain
