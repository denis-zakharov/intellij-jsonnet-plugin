name: Release

# Publishes to JetBrains Marketplace when a `vX.Y.Z` (or `vX.Y.Z-beta.N`) tag is pushed.
# The tag must match `pluginVersion` in gradle.properties; the checks below fail the run otherwise.
# Secrets live in the `marketplace` environment (Settings > Environments), which is also the
# place to require a manual approval before this workflow can touch them:
#   PUBLISH_TOKEN           Marketplace token (https://plugins.jetbrains.com/author/me/tokens)
#   CERTIFICATE_CHAIN       contents of chain.crt
#   PRIVATE_KEY             contents of private.pem
#   PRIVATE_KEY_PASSWORD    the password private.pem was generated with
# docs/publishing.md explains how to create the token and the signing material.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match pluginVersion
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pluginVersion=$version in gradle.properties"
            exit 1
          fi
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"

      - name: CHANGELOG must describe this version
        run: |
          if ! grep -q "^## \[$PLUGIN_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PLUGIN_VERSION]' section"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # publishPlugin depends on signPlugin (skipped only if the signing secrets are absent) and buildPlugin.
      - name: Sign and publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the signed archive (what was uploaded to the Marketplace) if signing ran.
          zip=$( (ls build/distributions/*-signed.zip 2>/dev/null || ls build/distributions/*.zip) | head -n 1)
          flags=""
          case "$PLUGIN_VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes $flags
